- table: {schema: public, name: organizations}
  array_relationships:
    - name: memberships
      using: {foreign_key_constraint_on: {column: org_id, table: {schema: public, name: org_members}}}
    - name: workflows
      using: {foreign_key_constraint_on: {column: org_id, table: {schema: public, name: workflows}}}
    - name: workflow_runs
      using: {foreign_key_constraint_on: {column: org_id, table: {schema: public, name: workflow_runs}}}
  select_permissions:
    - role: user
      permission:
        columns: [id, name, quota_limit, quota_used, quota_reserved, quota_period_start, created_at, updated_at]
        filter:
          memberships:
            user_id: {_eq: X-Hasura-User-Id}
  update_permissions:
    - role: user
      permission:
        columns: [name]
        filter:
          memberships:
            _and:
              - user_id: {_eq: X-Hasura-User-Id}
              - role: {_eq: owner}
        check:
          memberships:
            _and:
              - user_id: {_eq: X-Hasura-User-Id}
              - role: {_eq: owner}

- table: {schema: public, name: org_members}
  object_relationships:
    - name: organization
      using: {foreign_key_constraint_on: org_id}
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, user_id, role]
        check:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_eq: owner}
  update_permissions:
    - role: user
      permission:
        columns: [role]
        filter:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_eq: owner}
        check:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_eq: owner}
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_eq: owner}

- table: {schema: public, name: workflows}
  object_relationships:
    - name: organization
      using: {foreign_key_constraint_on: org_id}
  array_relationships:
    - name: steps
      using: {foreign_key_constraint_on: {column: workflow_id, table: {schema: public, name: workflow_steps}}}
    - name: triggers
      using: {foreign_key_constraint_on: {column: workflow_id, table: {schema: public, name: workflow_triggers}}}
    - name: runs
      using: {foreign_key_constraint_on: {column: workflow_id, table: {schema: public, name: workflow_runs}}}
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, name, description, enabled, created_by, created_at, updated_at]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, name, description, enabled]
        set: {created_by: X-Hasura-User-Id}
        check:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_in: [owner, editor]}
  update_permissions:
    - role: user
      permission:
        columns: [name, description, enabled]
        filter:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_in: [owner, editor]}
        check:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_in: [owner, editor]}
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_in: [owner, editor]}

- table: {schema: public, name: workflow_steps}
  object_relationships:
    - name: workflow
      using: {foreign_key_constraint_on: workflow_id}
  array_relationships:
    - name: step_runs
      using: {foreign_key_constraint_on: {column: workflow_step_id, table: {schema: public, name: step_runs}}}
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, position, name, type, config, archived, created_at, updated_at]
        filter:
          workflow:
            organization:
              memberships:
                user_id: {_eq: X-Hasura-User-Id}
  insert_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, position, name, type, config]
        check:
          _and:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: {_eq: X-Hasura-User-Id}
                      - role: {_in: [owner, editor]}
            - _or:
                - type: {_nin: [db_write, notify]}
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: {_eq: X-Hasura-User-Id}
                          - role: {_eq: owner}
  update_permissions:
    - role: user
      permission:
        columns: [position, name, type, config, archived]
        filter:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: {_eq: X-Hasura-User-Id}
                      - role: {_eq: owner}
            - _and:
                - type: {_nin: [db_write, notify]}
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: {_eq: X-Hasura-User-Id}
                          - role: {_eq: editor}
        check:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: {_eq: X-Hasura-User-Id}
                      - role: {_eq: owner}
            - _and:
                - type: {_nin: [db_write, notify]}
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: {_eq: X-Hasura-User-Id}
                          - role: {_eq: editor}
  delete_permissions:
    - role: user
      permission:
        filter:
          _or:
            - workflow:
                organization:
                  memberships:
                    _and:
                      - user_id: {_eq: X-Hasura-User-Id}
                      - role: {_eq: owner}
            - _and:
                - type: {_nin: [db_write, notify]}
                - workflow:
                    organization:
                      memberships:
                        _and:
                          - user_id: {_eq: X-Hasura-User-Id}
                          - role: {_eq: editor}

