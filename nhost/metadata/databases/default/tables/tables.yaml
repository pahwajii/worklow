- table: {schema: public, name: workflow_runs}
  object_relationships:
    - name: workflow
      using: {foreign_key_constraint_on: workflow_id}
    - name: organization
      using: {foreign_key_constraint_on: org_id}
  array_relationships:
    - name: step_runs
      using: {foreign_key_constraint_on: {column: workflow_run_id, table: {schema: public, name: step_runs}}}
    - name: run_jobs
      using: {foreign_key_constraint_on: {column: workflow_run_id, table: {schema: public, name: run_jobs}}}
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, org_id, status, trigger_type, trigger_input, execution_context, cursor_position, started_by, started_at, completed_at, error, created_at, updated_at]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}

- table: {schema: public, name: step_runs}
  object_relationships:
    - name: workflow_run
      using: {foreign_key_constraint_on: workflow_run_id}
    - name: workflow_step
      using: {foreign_key_constraint_on: workflow_step_id}
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_run_id, workflow_step_id, status, input, output, error, attempt_count, approved_by, approved_at, started_at, completed_at, created_at, updated_at]
        filter:
          workflow_run:
            organization:
              memberships:
                user_id: {_eq: X-Hasura-User-Id}

- table: {schema: public, name: run_jobs}
  object_relationships:
    - name: workflow_run
      using: {foreign_key_constraint_on: workflow_run_id}
  event_triggers:
    - name: run_jobs_inserted
      definition:
        enable_manual: false
        insert: {columns: '*'}
      retry_conf: {interval_sec: 10, num_retries: 3, timeout_sec: 60}
      webhook_from_env: WORKFLOW_EXECUTOR_WEBHOOK
      headers:
        - name: nhost-webhook-secret
          value_from_env: NHOST_WEBHOOK_SECRET

- table: {schema: public, name: workflow_data}
  object_relationships:
    - name: organization
      using: {foreign_key_constraint_on: org_id}
    - name: workflow_run
      using: {foreign_key_constraint_on: workflow_run_id}
    - name: workflow_step
      using: {foreign_key_constraint_on: workflow_step_id}
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, workflow_run_id, workflow_step_id, key, value, created_at]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}

- table: {schema: public, name: notification_outbox}
  object_relationships:
    - name: organization
      using: {foreign_key_constraint_on: org_id}
    - name: workflow_run
      using: {foreign_key_constraint_on: workflow_run_id}
    - name: workflow_step
      using: {foreign_key_constraint_on: workflow_step_id}
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, workflow_run_id, workflow_step_id, channel, destination, payload, status, error, created_at, sent_at]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}
  event_triggers:
    - name: notification_outbox_inserted
      definition:
        enable_manual: false
        insert: {columns: '*'}
      retry_conf: {interval_sec: 15, num_retries: 3, timeout_sec: 30}
      webhook_from_env: NOTIFICATION_WEBHOOK
      headers:
        - name: nhost-webhook-secret
          value_from_env: NHOST_WEBHOOK_SECRET

- table: {schema: public, name: watched_events}
  object_relationships:
    - name: organization
      using: {foreign_key_constraint_on: org_id}
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, event_type, payload, created_by, created_at]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}
  insert_permissions:
    - role: user
      permission:
        columns: [org_id, event_type, payload]
        set: {created_by: X-Hasura-User-Id}
        check:
          organization:
            memberships:
              _and:
                - user_id: {_eq: X-Hasura-User-Id}
                - role: {_in: [owner, editor]}
  event_triggers:
    - name: watched_events_inserted
      definition:
        enable_manual: false
        insert: {columns: '*'}
      retry_conf: {interval_sec: 10, num_retries: 3, timeout_sec: 60}
      webhook_from_env: DATABASE_EVENT_WEBHOOK
      headers:
        - name: nhost-webhook-secret
          value_from_env: NHOST_WEBHOOK_SECRET

- table: {schema: public, name: organization_usage_current_period}
  object_relationships:
    - name: organization
      using:
        manual_configuration:
          remote_table: {schema: public, name: organizations}
          column_mapping: {org_id: id}
  select_permissions:
    - role: user
      permission:
        columns: [org_id, quota_period_start, quota_limit, quota_used, quota_reserved, quota_remaining, usage_ratio]
        filter:
          organization:
            memberships:
              user_id: {_eq: X-Hasura-User-Id}
